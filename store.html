<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ஸ்டோர் | Fenix Naveen</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@700;800&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6FAFF;--ink:#13243F;--muted:#5B6B85;--blue:#2563EB;--soft:#E3EDFF;--sun:#FFC83D;--line:#DCE6F5;--ok:#15803D}
*{box-sizing:border-box;margin:0}body{font-family:'Noto Sans Tamil',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
header{background:rgba(246,250,255,.92);border-bottom:1px solid var(--line)}
nav,main{max-width:1080px;margin:0 auto;padding:0 20px}nav{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font-family:'Baloo Thambi 2',sans-serif;font-weight:800;font-size:1.3rem}.logo span{background:var(--sun);padding:0 8px;border-radius:8px;margin-right:4px}
.back{color:var(--blue);font-weight:600}
h1{font-family:'Baloo Thambi 2',sans-serif;font-size:clamp(1.8rem,4vw,2.5rem);margin:32px 0 4px;line-height:1.3}.sub{color:var(--muted);margin-bottom:20px}
.filters{display:flex;flex-wrap:wrap;gap:8px 24px;margin-bottom:24px}.grp{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;padding:5px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer}.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-bottom:60px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:16/9;background:var(--soft);display:grid;place-items:center;color:var(--blue);font-family:'Baloo Thambi 2',sans-serif;font-weight:700;font-size:1.1rem}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem}
.tag{background:var(--soft);color:var(--blue);padding:0 10px;border-radius:999px}.free{background:#E8F7ED;color:var(--ok);font-weight:600}.paid{background:#FFF3CC;color:#7A5200;font-weight:600}
.card h3{font-family:'Baloo Thambi 2',sans-serif;font-size:1.15rem;line-height:1.35}.card p{color:var(--muted);font-size:.92rem;flex:1}
.btn{display:block;text-align:center;font-family:'Baloo Thambi 2',sans-serif;font-weight:700;padding:9px 16px;border-radius:999px;background:var(--blue);color:#fff;margin-top:8px}
.btn.buy{background:var(--ink)}.empty{color:var(--muted);padding:30px 0}
</style></head><body>
<header><nav><a class="logo" href="index.html"><span>Fenix</span>Naveen</a><a class="back" href="index.html">முகப்பு</a></nav></header>
<main>
<h1>ஸ்டோர்</h1><p class="sub">இலவச மற்றும் கட்டண வகுப்புகள், ஆன்லைன் புத்தகங்கள்.</p>
<div class="filters"><div class="grp" id="ft" role="group" aria-label="வகை"></div><div class="grp" id="fa" role="group" aria-label="கட்டணம்"></div></div>
<div class="grid" id="grid" aria-live="polite"></div>
</main>
<script>
const PHONE='919524295040';let items=[],T='all',A='all';const $=id=>document.getElementById(id);
const TY={all:'அனைத்தும்',course:'வகுப்புகள்',book:'புத்தகங்கள்'},AC={all:'அனைத்தும்',free:'இலவசம்',paid:'கட்டணம்'};
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
function chips(el,map,get,set){Object.keys(map).forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=map[k];b.setAttribute('aria-pressed',k===get());
 b.onclick=()=>{set(k);el.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};el.append(b)})}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function draw(){const g=$('grid');g.textContent='';const f=items.filter(i=>(T==='all'||i.type===T)&&(A==='all'||i.access===A));
 if(!f.length){g.append(el('p','empty','இந்தப் பிரிவில் இன்னும் எதுவும் இல்லை.'));return}
 f.slice().reverse().forEach(i=>{const c=el('div','card'),im=el('div','img');
  if(safe(i.image)){const m=document.createElement('img');m.src=i.image;m.alt='';m.loading='lazy';m.onerror=()=>{m.remove();im.textContent=TY[i.type]};im.append(m)}else im.textContent=TY[i.type];
  const b=el('div','body'),meta=el('div','meta');meta.append(el('span','tag',TY[i.type]),el('span','tag',i.exam),el('span',i.access==='free'?'tag free':'tag paid',i.access==='free'?'இலவசம்':'₹'+i.price));
  const a=el('a','btn'+(i.access==='paid'?' buy':''));a.target='_blank';a.rel='noopener noreferrer';
  if(i.access==='free'){a.textContent='இலவசமாகப் பார்க்க';a.href=safe(i.link)}
  else{a.textContent='வாங்க · ₹'+i.price;a.href=safe(i.link)||'https://wa.me/'+PHONE+'?text='+encodeURIComponent('வணக்கம், "'+i.title+'" வாங்க விரும்புகிறேன்.')}
  b.append(meta,el('h3','',i.title),el('p','',i.desc),a);c.append(im,b);g.append(c)})}
chips($('ft'),TY,()=>T,v=>T=v);chips($('fa'),AC,()=>A,v=>A=v);
fetch('api.php?r=store').then(r=>r.json()).then(d=>{items=Array.isArray(d)?d:[];draw()}).catch(()=>{$('grid').textContent='ஸ்டோர் ஏற்ற முடியவில்லை.'});
</script></body></html>
